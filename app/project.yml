# XcodeGen project for Xrero Office (iPhone, iPad, Apple-silicon Mac "Designed for iPad").
# xcodegen generate  ->  XreroOffice.xcodeproj      (build/web is assembled by scripts/assemble_web.sh)
name: XreroOffice
options:
  bundleIdPrefix: com.xrero
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
  Autotest: debug
settings:
  base:
    MARKETING_VERSION: "20.0.9"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: Y5U46S55X5
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  XreroOffice:
    type: application
    platform: iOS
    sources:
      - path: XreroOffice
      - path: build/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xrero.office
        PRODUCT_NAME: XreroOffice
        INFOPLIST_FILE: XreroOffice/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
      configs:
        Autotest:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG XR_AUTOTEST
  XreroOfficeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [XreroOfficeUITests]
    dependencies:
      - target: XreroOffice
    settings:
      base:
        TEST_TARGET_NAME: XreroOffice
        PRODUCT_BUNDLE_IDENTIFIER: com.xrero.office.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  XreroOffice:
    build:
      targets:
        XreroOffice: all
        XreroOfficeUITests: [test]
    test:
      config: Autotest
      targets: [XreroOfficeUITests]
