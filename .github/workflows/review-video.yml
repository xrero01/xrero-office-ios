name: review-video
# App Review screen recording: the real app (Debug build = the App Store app's flow, no test overlay) on the newest
# iPhone simulator, driven by ReviewVideoTests while `simctl io recordVideo` records the screen from the Home screen on.
# The store samples are put in "On My iPhone > Xrero Office" first. Output: release review-video-r<run> (mp4 + shots).
on:
  workflow_dispatch:
    inputs:
      editors:
        description: release tag holding ios-editors-<version>.zip
        default: "ios-editors-20.0.9"
      device:
        description: simulator name prefix
        default: "iPhone 17 Pro"
      runner:
        description: GitHub macOS image (macos-26 matches the iOS 26 simulator; older hosts break FileProvider)
        default: "macos-26"

permissions:
  contents: write

jobs:
  video:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode + tools
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          brew install xcodegen >/dev/null

      - name: Editors + app web folder + project
        run: |
          set -e
          gh release download "${{ inputs.editors }}" -R "$GITHUB_REPOSITORY" -p "*.zip" -p "*.sha256"
          tr -d '\r' < ios-editors-*.zip.sha256 | shasum -a 256 -c -
          bash scripts/assemble_web.sh ios-editors-*.zip app/build/web
          cd app && xcodegen generate

      - name: Build the real app (Debug) + UI tests
        run: |
          set -o pipefail
          cd app
          xcodebuild build-for-testing -project XreroOffice.xcodeproj -scheme XreroOffice -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath ../dd CODE_SIGNING_ALLOWED=NO | tail -5

      - name: Record
        run: |
          set +e
          mkdir -p out
          xcrun simctl list devices available -j > devices.json
          DEV=$(python3 scripts/pick_sim.py devices.json "${{ inputs.device }}" || python3 scripts/pick_sim.py devices.json "iPhone")
          sw_vers; xcodebuild -version; xcrun simctl list devices | grep "$DEV"
          # on-screen keyboard like a real phone (no Mac keyboard attached to the simulator)
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot $DEV; xcrun simctl bootstatus $DEV -b >/dev/null
          xcrun simctl status_bar $DEV override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          APP=$(ls -d dd/Build/Products/Debug-iphonesimulator/XreroOffice.app)
          xcrun simctl install $DEV "$APP"
          C=$(xcrun simctl get_app_container $DEV com.xrero.office data); echo "container $C"
          mkdir -p "$C/Documents" && cp store/samples/sales_en.xlsx store/samples/deck_en.pptx "$C/Documents/"
          ls -la "$C/Documents"
          xcrun simctl io $DEV recordVideo --codec=h264 --force out/review-iphone.mp4 & REC=$!
          sleep 3
          xcodebuild test-without-building -project app/XreroOffice.xcodeproj -scheme XreroOffice -configuration Debug \
            -destination "id=$DEV" -derivedDataPath dd -resultBundlePath out/review.xcresult \
            -only-testing:XreroOfficeUITests/ReviewVideoTests/testReviewFlow 2>&1 | grep -E "Test Case|error|XCTAssert|failed" | tail -20
          sleep 2
          kill -INT $REC; wait $REC
          # what the system said while the document browser created / imported / opened documents
          xcrun simctl spawn $DEV log show --last 15m --style compact --predicate             'process == "XreroOffice" OR subsystem BEGINSWITH "com.apple.DocumentManager" OR subsystem BEGINSWITH "com.apple.FileProvider" OR process == "fileproviderd" OR process == "DocumentManagerUICore"'             > out/sim-log.txt 2>&1
          grep -i -E "error|fail|import|denied|sandbox" out/sim-log.txt | grep -v -i "No error" | tail -80
          echo "== app Documents"; ls -la "$C/Documents"; find "$C" -name "*.docx" 2>/dev/null | head
          ls -la out
          xcrun xcresulttool export attachments --path out/review.xcresult --output-path out/attachments >/dev/null 2>&1
          ls out/attachments | head -60
          xcrun simctl shutdown $DEV

      - name: Publish (release)
        if: ${{ always() }}
        run: |
          cd out
          [ -d attachments ] && ditto -c -k --keepParent attachments review-attachments.zip
          gh release create "review-video-r${GITHUB_RUN_NUMBER}" --prerelease --title "App Review video ${GITHUB_RUN_NUMBER}" \
            --notes "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -R "$GITHUB_REPOSITORY" \
            $(ls review-iphone.mp4 review-attachments.zip sim-log.txt 2>/dev/null)
