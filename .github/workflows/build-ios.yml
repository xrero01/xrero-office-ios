name: build-ios
on:
  workflow_dispatch:
    inputs:
      editors:
        description: release tag holding ios-editors-<version>.zip
        default: "ios-editors-21.0"
      only:
        description: "optional, for a quick round: run only these tests (space-separated Class or Class/testName); the gate needs the full run"
        default: ""

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    # 120: the document-menu test (M7b) adds ~6 min per device; a slow shared runner cut the iPad half at 90.
    # 210: iPhone then iPad: the stage-4 gates (sheet, slides, PDF, templates) take ~2 h together; the reading-view
    # gate (S2) adds ~5-8 min per device.
    # 300: stage 6 = stage 5 (UI tests 159 min, run 161) + S2 reading (+25 min, run 170) + S9 Files (+16 min, run 166)
    # + S6 window gate: ~205-215 min of UI tests alone - a 210 limit would cancel a passing run near its end
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode + tools
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          brew install xcodegen >/dev/null
          python3 -m pip install --quiet --break-system-packages pillow pypdf 2>/dev/null || true
          # PyMuPDF (21.0 PDF form check): draws the saved form fields outside the app; check_saved.py falls back to pypdf
          python3 -m pip install --quiet --break-system-packages pymupdf 2>/dev/null || echo "pymupdf not installed (pypdf checks only)"
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20

      - name: Arabic blank templates are the generated right-to-left ones
        run: python3 scripts/make_blank_templates.py --verify

      - name: Template gallery files are the generated ones (EN + AR, right-to-left Arabic, live formulas)
        run: python3 scripts/make_gallery_templates.py --verify

      - name: Reading-view test files are the generated ones (6-page .docx + .pdf, plan S2)
        run: python3 scripts/make_reading_fixtures.py --verify

      - name: Editors (Xrero payload subset) + app web folder
        run: |
          set -e
          gh release download "${{ inputs.editors }}" -R "$GITHUB_REPOSITORY" -p "*.zip" -p "*.sha256"
          tr -d '\r' < ios-editors-*.zip.sha256 | shasum -a 256 -c -
          bash scripts/assemble_web.sh ios-editors-*.zip app/build/web

      - name: Engine contract (every editor internal xr-host.js relies on is still in the packaged editors)
        run: python3 scripts/check_contract.py web/xr-contract.json app/build/web/editors

      - name: Generate Xcode project
        run: cd app && xcodegen generate

      - name: Build for simulator (Autotest configuration)
        run: |
          cd app
          # pipefail: a failed build stops the run here (the tail used to hide it until the tests could not install)
          set -o pipefail
          xcodebuild build-for-testing -project XreroOffice.xcodeproj -scheme XreroOffice -configuration Autotest \
            -destination "generic/platform=iOS Simulator" -derivedDataPath ../dd CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee ../build.log | tail -25 || { grep -E ": error: |: error:" ../build.log | sort -u | head -60; exit 1; }

      - name: UI tests on iPhone + iPad (real keyboard typing, save, Arabic sample)
        env:
          ONLY_TESTS: ${{ inputs.only }}
        run: |
          set +e
          mkdir -p out/shots out/saved
          xcrun simctl list devices available -j > devices.json
          IPHONE=$(python3 scripts/pick_sim.py devices.json iPhone)
          # the 13-inch iPad Pro is where the design review saw the clipped ribbon and the portrait panel (1032 pt wide)
          IPAD=$(python3 scripts/pick_sim.py devices.json "iPad Pro 13-inch" "iPad Pro (12.9-inch)" "iPad Pro")
          echo "iPhone $IPHONE  iPad $IPAD"
          # an empty id would silently test the iPhone alone and still pass
          if [ -z "$IPHONE" ] || [ -z "$IPAD" ]; then echo "error: no iPhone or iPad simulator found"; exit 1; fi
          export TEST_RUNNER_XR_SAMPLE_NAME=ar_letter.docx
          export TEST_RUNNER_XR_SAMPLE_B64=$(base64 -i tests/ar_letter.docx | tr -d '\n')
          export TEST_RUNNER_XR_PDF_B64=$(base64 -i tests/ar_letter.pdf | tr -d '\n')
          # the reading view (plan S2): 6-page files, so its page capsule / Go to Page / scrolling are really exercised
          export TEST_RUNNER_XR_READ_DOCX_B64=$(base64 -i tests/reading_6p.docx | tr -d '\n')
          export TEST_RUNNER_XR_READ_PDF_B64=$(base64 -i tests/reading_6p.pdf | tr -d '\n')
          # PDF forms (21.0, testPdfFormFields): an embedded-Arabic-font form and a booking form with check boxes
          export TEST_RUNNER_XR_FORM_B64=$(base64 -i tests/ar_form_embedded.pdf | tr -d '\n')
          export TEST_RUNNER_XR_BOOK_B64=$(base64 -i tests/ar_booking_form.pdf | tr -d '\n')
          # AccountWallUITests: the required Xrero account (wall, held requests, local session; no account is created)
          TESTS="-only-testing:XreroOfficeUITests/AccountWallUITests -only-testing:XreroOfficeUITests/EditorUITests -only-testing:XreroOfficeUITests/TemplateGalleryUITests -only-testing:XreroOfficeUITests/ScanQuickActionUITests -only-testing:XreroOfficeUITests/OpenInUITests"
          if [ -n "$ONLY_TESTS" ]; then TESTS=""; for T in $ONLY_TESTS; do TESTS="$TESTS -only-testing:XreroOfficeUITests/$T"; done; fi
          echo "tests: $TESTS"
          RC=0
          for DEV in $IPHONE $IPAD; do
            xcrun simctl boot $DEV 2>/dev/null; xcrun simctl bootstatus $DEV -b >/dev/null
            ( while true; do xcrun simctl io $DEV screenshot "out/shots/$DEV-$(date +%H%M%S).png" >/dev/null 2>&1; sleep 6; done ) & SHOOT=$!
            # out/ui-<device>.log: the whole filtered output (check_saved.py lists every skipped test and retried tap)
            xcodebuild test-without-building -project app/XreroOffice.xcodeproj -scheme XreroOffice -configuration Autotest \
              -destination "id=$DEV" -derivedDataPath dd -resultBundlePath "out/ui-$DEV.xcresult"               $TESTS 2>&1 | grep -E "Test Case|error|passed|failed|XCTAssert|XR save path|XR save-as path|XR web buttons|XR geom|XR rotate|XR bridge|XR contract|XR chrome|XR touch|XR bar|XR menu|XR title menu|XR sheet|XR template|XR pdf-gate|XR quick|XR scan|XR springboard|XR open-in|XR a11y|XR first line|XR files|XR read|XR window|XR crash|XR form|XR account" | tee "out/ui-$DEV.log" | tail -1000
            R=${PIPESTATUS[0]}; [ $R -ne 0 ] && RC=$R
            # the tail above keeps only the last tests of a full run: every test's result (and the Files gate, plan S9)
            # once more, in one short list - the whole filtered output is in the evidence zip (out/ui-<device>.log)
            echo "== $DEV: test results (xcodebuild exit $R)"
            grep -E "Test Case '.*' (passed|failed)|: error: |XR files" "out/ui-$DEV.log" | cut -c1-400
            kill $SHOOT
            C=$(xcrun simctl get_app_container $DEV com.xrero.office data 2>/dev/null)
            [ -n "$C" ] && cp -R "$C/Documents" "out/saved/$DEV" 2>/dev/null
            # open-in test (plan S11): the original opened in place, outside the app's folder
            [ -n "$C" ] && [ -d "$C/Library/Application Support/Outside" ] && cp -R "$C/Library/Application Support/Outside" "out/saved/$DEV/_outside" 2>/dev/null
            xcrun xcresulttool export attachments --path "out/ui-$DEV.xcresult" --output-path "out/shots/attach-$DEV" >/dev/null 2>&1
            xcrun simctl shutdown $DEV
          done
          ls -R out/saved | head -60
          exit $RC

      - name: Check the saved files (typed English + Arabic reached the .docx)
        if: ${{ always() }}
        run: python3 scripts/check_saved.py out/saved

      - name: Publish evidence (release, private repo)
        if: ${{ always() }}
        run: |
          mkdir -p out; rm -rf out/*.xcresult
          ditto -c -k --keepParent out "ios-evidence.zip"
          gh release create "ios-test-r${GITHUB_RUN_NUMBER}" --prerelease --title "iOS test build ${GITHUB_RUN_NUMBER}" \
            --notes "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -R "$GITHUB_REPOSITORY" ios-evidence.zip
