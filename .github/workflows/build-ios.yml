name: build-ios
on:
  workflow_dispatch:
    inputs:
      editors:
        description: release tag holding ios-editors-<version>.zip
        default: "ios-editors-20.0.9"

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode + tools
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); echo "using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          brew install xcodegen >/dev/null
          python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || true
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20

      - name: Editors (Xrero payload subset) + app web folder
        run: |
          set -e
          gh release download "${{ inputs.editors }}" -R "$GITHUB_REPOSITORY" -p "*.zip" -p "*.sha256"
          tr -d '\r' < ios-editors-*.zip.sha256 | shasum -a 256 -c -
          bash scripts/assemble_web.sh ios-editors-*.zip app/build/web

      - name: Generate Xcode project
        run: cd app && xcodegen generate

      - name: Build for simulator (Autotest configuration)
        run: |
          cd app
          xcodebuild build-for-testing -project XreroOffice.xcodeproj -scheme XreroOffice -configuration Autotest \
            -destination "generic/platform=iOS Simulator" -derivedDataPath ../dd CODE_SIGNING_ALLOWED=NO | tail -25

      - name: UI tests on iPhone + iPad (real keyboard typing, save, Arabic sample)
        run: |
          set +e
          mkdir -p out/shots out/saved
          xcrun simctl list devices available -j > devices.json
          IPHONE=$(python3 scripts/pick_sim.py devices.json iPhone)
          IPAD=$(python3 scripts/pick_sim.py devices.json "iPad Pro")
          echo "iPhone $IPHONE  iPad $IPAD"
          export TEST_RUNNER_XR_SAMPLE_NAME=ar_letter.docx
          export TEST_RUNNER_XR_SAMPLE_B64=$(base64 -i tests/ar_letter.docx | tr -d '\n')
          RC=0
          for DEV in $IPHONE $IPAD; do
            xcrun simctl boot $DEV 2>/dev/null; xcrun simctl bootstatus $DEV -b >/dev/null
            ( while true; do xcrun simctl io $DEV screenshot "out/shots/$DEV-$(date +%H%M%S).png" >/dev/null 2>&1; sleep 6; done ) & SHOOT=$!
            xcodebuild test-without-building -project app/XreroOffice.xcodeproj -scheme XreroOffice -configuration Autotest \
              -destination "id=$DEV" -derivedDataPath dd -resultBundlePath "out/ui-$DEV.xcresult" 2>&1 | grep -E "Test Case|error|passed|failed|XCTAssert|XR save path|XR web buttons" | tail -50
            R=${PIPESTATUS[0]}; [ $R -ne 0 ] && RC=$R
            kill $SHOOT
            C=$(xcrun simctl get_app_container $DEV com.xrero.office data 2>/dev/null)
            [ -n "$C" ] && cp -R "$C/Documents" "out/saved/$DEV" 2>/dev/null
            xcrun xcresulttool export attachments --path "out/ui-$DEV.xcresult" --output-path "out/shots/attach-$DEV" >/dev/null 2>&1
            xcrun simctl shutdown $DEV
          done
          ls -R out/saved | head -30
          exit $RC

      - name: Check the saved files (typed English + Arabic reached the .docx)
        if: ${{ always() }}
        run: python3 scripts/check_saved.py out/saved

      - name: Publish evidence (release, private repo)
        if: ${{ always() }}
        run: |
          mkdir -p out; rm -rf out/*.xcresult
          ditto -c -k --keepParent out "ios-evidence.zip"
          gh release create "ios-test-r${GITHUB_RUN_NUMBER}" --prerelease --title "iOS test build ${GITHUB_RUN_NUMBER}" \
            --notes "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" -R "$GITHUB_REPOSITORY" ios-evidence.zip
