<!DOCTYPE html>
<!-- xr-editor.html - Xrero Office (iPhone / iPad / Mac) editor launcher. Lives next to api.js in
     editors/web-apps/apps/api/documents/. Query: doctype=word|cell|slide|pdf, title=<file name>, lang=en|ar,
     theme=light|dark. The document itself comes from the app through xr-host.js (desktop "local file" mode). -->
<html>
<head>
  <meta charset="utf-8">
  <title>Xrero Office</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #f7f7f7; }
    @media (prefers-color-scheme: dark) { html, body { background: #333333; } }
    /* the editor ends ABOVE the home indicator (its status bar was half under it); the strip below has the status
       bar's colour */
    #wrap { position: absolute; left: env(safe-area-inset-left); right: env(safe-area-inset-right); top: 0;
            bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <div id="wrap"><div id="placeholder"></div></div>
  <script src="api.js"></script>
  <script>
  (function () {
    var q = {};
    location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
      var p = kv.split('='); if (p[0]) q[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
    });
    var phone = Math.min(screen.width, screen.height) < 600;
    var lang = q.lang === 'ar' ? 'ar' : 'en';
    var dark = q.theme ? q.theme === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var ext = (/\.([a-z0-9]+)$/i.exec(q.title || '') || [0, 'docx'])[1].toLowerCase();
    var key = 'xr' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    window.docEditor = new DocsAPI.DocEditor('placeholder', {
      type: 'desktop',
      width: '100%', height: '100%',
      documentType: q.doctype || 'word',
      document: {
        key: key, url: '_offline_', title: q.title || 'Document', fileType: ext,
        permissions: { edit: true, download: true, print: false, review: true, comment: true }
      },
      editorConfig: {
        mode: 'edit',
        lang: lang,
        region: lang === 'ar' ? 'ar-AE' : 'en-US',
        user: { id: 'xr-ios', name: lang === 'ar' ? 'أنا' : 'Me' },
        customization: {
          uiTheme: dark ? 'theme-dark' : 'theme-light',
          // ONLYOFFICE: -1 = fit the whole page / slide, -2 = fit the page WIDTH (Main.js zoomFitToPage / zoomFitToWidth).
          // Slides: the whole slide everywhere. Word / PDF on phones and portrait iPads: page width (fit-page shrank the
          // text to ~4 pt once the keyboard took half the height). Landscape iPad 100%, spreadsheets on iPad 120%.
          zoom: (q.doctype === 'slide') ? -1
              : (phone || window.innerHeight > window.innerWidth) && q.doctype !== 'cell' ? -2
              : (q.doctype === 'cell' && !phone) ? 120 : 100,
          compactToolbar: phone,
          compactHeader: phone,
          hideRulers: phone,
          // phones and portrait iPads: the settings panel on the right starts closed (its side button opens it)
          hideRightMenu: phone || window.innerWidth < 1000,
          // phones: no speaker-notes pane under the slide (View > Notes brings it back)
          hideNotes: phone,
          // phones: the page gets the whole width (side icon columns hidden; their features stay in the tabs)
          // (Slides keep the left menu: its button reopens the slide strip, which starts collapsed on phones)
          layout: phone ? { leftMenu: (q.doctype === 'slide'), rightMenu: false } : {},
          feedback: false,
          help: false,
          plugins: false,
          macros: false,
          about: false,
          goback: false
        }
      },
      events: {
        onRequestClose: function () { window.XreroHost && XreroHost.command('close', ''); return 0; }
      }
    });
  })();
  </script>
</body>
</html>
